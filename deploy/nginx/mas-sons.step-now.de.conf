# mas-sons.step-now.de — M.A.S & SONS client preview, on the step-now.de VPS.
# Installed by scripts/deploy.sh to /etc/nginx/sites-available/mas-sons.step-now.de.
# Independent of step-now.de's own vhost: step-now's deploy.sh never touches this file.
#
#   Next.js  127.0.0.1:3100   everything, behind HTTP basic auth (client preview only)
#   FastAPI  127.0.0.1:8100   /uploads/ only — the browser never calls the API directly (BFF)
#
# Basic-auth users: /etc/nginx/mas-sons.htpasswd, written by deploy.sh from /etc/mas-sons/deploy.env.

server {
    listen 80;
    listen [::]:80;
    server_name mas-sons.step-now.de;

    # Let's Encrypt HTTP-01 — certbot renews through this webroot, so it must stay reachable.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mas-sons.step-now.de;

    ssl_certificate     /etc/letsencrypt/live/mas-sons.step-now.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mas-sons.step-now.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mas_sons_ssl:10m;

    # A private preview: never indexed, never framed elsewhere.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;   # unit photo / auction-sheet uploads

    auth_basic           "M.A.S & SONS - client preview";
    auth_basic_user_file /etc/nginx/mas-sons.htpasswd;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Unit photos. Public: Next's image optimizer fetches https://mas-sons.step-now.de/uploads/…
    # server-side and cannot send the basic-auth password. Files only, no listing, no API.
    location /uploads/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
