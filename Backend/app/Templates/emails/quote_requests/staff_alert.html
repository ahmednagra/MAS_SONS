{% extends "base.html" %}
{% block content %}
<h2 style="margin-top:0;">New quote request #{{ quote_request_id }}</h2>
<p><strong>{{ contact_name }}</strong> ({{ contact_email }}) requested a quote for <strong>{{ unit_make }} {{ unit_model }} ({{ unit_year }})</strong>.</p>
<p>Destination: {{ destination_country }} — Incoterm: {{ incoterm }}</p>
{% endblock %}
